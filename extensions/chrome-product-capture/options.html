<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dovix 연결 설정</title><link rel="stylesheet" href="styles.css"><body><main class="options"><p class="eyebrow">DOVIX · 연결 설정</p><h1>상품을 보낼 프로젝트</h1><p>Dovix의 쇼핑몰 관리 → 설정 → 크롬 상품 수집에서 연결 정보를 만들고 여기에 붙여넣으세요.</p><form><label for="connection">연결 정보</label><textarea id="connection" rows="7" autocomplete="off" spellcheck="false" required placeholder="복사한 연결 정보를 붙여넣으세요"></textarea><div class="actions"><button type="button" id="disconnect" class="secondary">연결 해제</button><button type="submit">연결하기</button></div></form><p id="status" role="status" aria-live="polite"></p><p class="muted">현재 상품 페이지는 확장 버튼을 눌렀을 때만 읽습니다. 인증 정보와 브라우저 쿠키는 보내지 않습니다.</p></main><script type="module" src="options.js"></script></body></html>
